[workspace]
name = "fastsuite"
version = "0.1.0"
description = "FastSuite — Rust QC and preprocessing tools sharing one CLI, one report schema and one runner"
authors = ["RaphaelRibes <raphael.ribes@gmail.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
rust = ">=1.85,<1.96"
pkg-config = "*"
c-compiler = "*"
cmake = "*"       # flate2's zlib-ng builds from source
zlib = "*"
zstd = "*"

# NOTE: pixi executes tasks with sh/bash, NOT fish — write plain POSIX shell
# (no `for ...; do ...; done` fish one-liner with parens, no `and`/`or`).
# The `scripts/*.sh` wrappers are what the tasks call.
[tasks]
# Build every tool in dependency order (fasthelper last).
build = "bash scripts/build.sh"
build-offline = "bash scripts/build.sh --offline"
# All six tool test suites (397 tests).
test = "bash scripts/test.sh"
doctor = "./tools/fasthelper/target/release/fasthelper doctor --tools-dir tools"
demo = "bash examples/demo.sh"
report = "./tools/fasthelper/target/release/fasthelper report examples/runs/demo -o examples/runs/demo --format html,tsv"
schema = "./tools/fasthelper/target/release/fasthelper schema"
