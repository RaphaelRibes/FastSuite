[workspace]
name = "fastsuite"
version = "0.1.0"
description = "FastSuite — Rust QC and preprocessing tools sharing one CLI, one report schema and one runner"
authors = ["RaphaelRibes <raphael.ribes@gmail.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
rust = ">=1.85,<1.96"
pkg-config = "*"
c-compiler = "*"
cmake = "*"       # flate2's zlib-ng builds from source
zlib = "*"
zstd = "*"

# The conda `rust` package's activation script hard-codes
#   export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=<conda>/x86_64-conda-linux-gnu-cc
# and that env var OVERRIDES .cargo/config.toml's linker= (env beats config in
# cargo's precedence). The conda toolchain's 2.28 sysroot links Rust binaries
# against a Scrt1.o referencing __libc_csu_init/__libc_csu_fini (glibc symbols
# removed in 2.34), so the link fails on any machine whose glibc also lacks
# them. Point the linker at the system cc instead; the C build scripts (cc
# crate, cmake for zlib-ng/libdeflate/zstd) still use the conda compiler and
# build fine — only the final link was ever broken.
[activation.env]
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "/usr/bin/cc"

# NOTE: pixi executes tasks with sh/bash, NOT fish — write plain POSIX shell
# (no `for ...; do ...; done` fish one-liner with parens, no `and`/`or`).
# The `scripts/*.sh` wrappers are what the tasks call.
[tasks]
# Build every tool in dependency order (fasthelper last).
build = "bash scripts/build.sh"
build-offline = "bash scripts/build.sh --offline"
# All six tool test suites (397 tests).
test = "bash scripts/test.sh"
doctor = "./tools/fasthelper/target/release/fasthelper doctor --tools-dir tools"
demo = "bash examples/demo.sh"
report = "./tools/fasthelper/target/release/fasthelper report examples/runs/demo -o examples/runs/demo --format html,tsv"
schema = "./tools/fasthelper/target/release/fasthelper schema"
