[workspace]
name = "fastsuite"
version = "0.1.0"
description = "FastSuite — Rust QC and preprocessing tools sharing one CLI, one report schema and one runner"
authors = ["RaphaelRibes <raphael.ribes@gmail.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# 1.99 measured 1.44x FASTER than 1.95 on identical source (fastcheck, 5M reads,
# same idle machine, 3 reps interleaved: 74.35 s vs 107.25 s, memory identical).
# The old ">=1.85,<1.96" pin was therefore costing ~31% of the suite's speed.
#
# THE PIN ALONE DOES NOT DETERMINE THE COMPILER. A build that invokes the env's
# cargo binary *directly* resolves `rustc` from PATH and silently links with
# whatever is installed system-wide -- that is how the same source produced two
# binaries 1.44x apart on two machines, with nothing in either log recording it.
# Always build through `pixi run` (which puts the env's bin first), and verify
# with `md5sum` that a rebuild actually changed the binary.
rust = ">=1.99,<2"
pkg-config = "*"
c-compiler = "*"
cmake = "*"       # flate2's zlib-ng builds from source
zlib = "*"
zstd = "*"

# The conda `rust` package's activation script hard-codes
#   export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=<conda>/x86_64-conda-linux-gnu-cc
# and that env var OVERRIDES .cargo/config.toml's linker= (env beats config in
# cargo's precedence). The conda toolchain's 2.28 sysroot links Rust binaries
# against a Scrt1.o referencing __libc_csu_init/__libc_csu_fini (glibc symbols
# removed in 2.34), so the link fails on any machine whose glibc also lacks
# them. Point the linker at the system cc instead; the C build scripts (cc
# crate, cmake for zlib-ng/libdeflate/zstd) still use the conda compiler and
# build fine — only the final link was ever broken.
[activation.env]
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "/usr/bin/cc"

# NOTE: pixi executes tasks with sh/bash, NOT fish — write plain POSIX shell
# (no `for ...; do ...; done` fish one-liner with parens, no `and`/`or`).
# The `scripts/*.sh` wrappers are what the tasks call.

# ---------------------------------------------------------------------------
# pixitainer (D-3) — the suite container image.
#
# ONE image, not six. D-3's wording ("one pixitainer recipe per tool") mirrors
# the bioconda split, but a per-tool image here would mean paying for the full
# rust+cmake+compiler toolchain six times over (each image must *build* the
# crate, since there is no published binary to pull) to ship 1-27 MB of
# statically linked binary. The six tools share one CLI, one report schema and
# one runner (fasthelper), and the suite's own build order is one command
# (`pixi run build`), so a single image carrying all six binaries is both
# cheaper to build and more useful: `fasthelper run` can drive the chain
# without a second image.
#
# MANUAL MODE IS NOT OPTIONAL. Seamless mode sets the entrypoint to
# `pixi run --locked --as-is -m /opt/conf/pixi.toml "$@"`, and `pixi run`
# consumes its own flags before the payload: `pixi run --as-is --version`
# fails with "unexpected argument '--version' found". A QC tool's contract is
# `fastcheck --version`, so `manual = true` is what makes the image behave like
# the installed binary.
#
# HOW THE BINARIES GET INTO THE IMAGE: pixitainer ships the manifest, the
# lockfile and whatever `-a/--add-file` names — nothing else. So the six
# `tools/<t>` source trees are added explicitly and the binaries are built
# *inside* the image. That keeps the recipe honest about D-11: the image is
# built from committed source and no prebuilt artifact (which could silently
# carry data) is ever injected. tools/*/target/ is deliberately NOT added — it
# holds 3.7 GB of local build state; the %files block lists each tool's
# Cargo.toml/Cargo.lock/src individually, so target/ is excluded by
# construction, not by a later cleanup step.
# ---------------------------------------------------------------------------
[tool.pixitainer]
manual = true
base-image = "ubuntu:24.04"
output = "fastsuite.sif"
env = ["default"]
# Pin the in-image pixi to the host's version, so a future host pixi cannot
# silently change how the frozen lockfile is installed.
pixi-version = "0.73.0"
keep-def = true

# Six source trees, minus target/. .cargo/config.toml is repo-level and points
# the final Rust link at /usr/bin/cc — hence gcc in the post-commands below.
add-file = [
    ".cargo/config.toml:/opt/conf/.cargo/config.toml",
    "tools/fastcheck/Cargo.toml:/opt/conf/tools/fastcheck/Cargo.toml",
    "tools/fastcheck/Cargo.lock:/opt/conf/tools/fastcheck/Cargo.lock",
    "tools/fastcheck/src:/opt/conf/tools/fastcheck/src",
    "tools/fastdedup/Cargo.toml:/opt/conf/tools/fastdedup/Cargo.toml",
    "tools/fastdedup/Cargo.lock:/opt/conf/tools/fastdedup/Cargo.lock",
    "tools/fastdedup/src:/opt/conf/tools/fastdedup/src",
    "tools/fastprep/Cargo.toml:/opt/conf/tools/fastprep/Cargo.toml",
    "tools/fastprep/Cargo.lock:/opt/conf/tools/fastprep/Cargo.lock",
    "tools/fastprep/src:/opt/conf/tools/fastprep/src",
    "tools/fastsim/Cargo.toml:/opt/conf/tools/fastsim/Cargo.toml",
    "tools/fastsim/Cargo.lock:/opt/conf/tools/fastsim/Cargo.lock",
    "tools/fastsim/src:/opt/conf/tools/fastsim/src",
    "tools/fastmaps/Cargo.toml:/opt/conf/tools/fastmaps/Cargo.toml",
    "tools/fastmaps/Cargo.lock:/opt/conf/tools/fastmaps/Cargo.lock",
    "tools/fastmaps/src:/opt/conf/tools/fastmaps/src",
    "tools/fasthelper/Cargo.toml:/opt/conf/tools/fasthelper/Cargo.toml",
    "tools/fasthelper/Cargo.lock:/opt/conf/tools/fasthelper/Cargo.lock",
    "tools/fasthelper/src:/opt/conf/tools/fasthelper/src",
    "scripts/build.sh:/opt/conf/scripts/build.sh",
]

# `pixi run --as-is build-offline` — NOT `bash scripts/build.sh --offline`.
# Verified in a throwaway probe image: pixitainer's %post does NOT activate the
# pixi environment, so a bare `bash scripts/build.sh` dies immediately with
# "cargo: command not found" — cargo lives at
# /opt/conf/.pixi/envs/default/bin/cargo, which is only on PATH inside an
# activated env. `pixi run` activates the env itself, so the build task stays
# the single entry point and the fix needs no change to scripts/build.sh.
#
# DEVIATION from the bioconda "no build-time downloads" rule, deliberate and
# documented: the crates are NOT in the pixi env — they live in the HOST's
# ~/.cargo/registry (380 MB), which is not shipped into the image. Shipping
# them would bloat the image by 380 MB; vendoring is worse (166 MB for ONE
# tool, each with its own lock). So the image build fetches the crates from
# crates.io during construction. The rule's purpose — a PUBLISHED package must
# not depend on a live registry at INSTALL time — is preserved: the fetch
# happens once, while the image is built, and every Cargo.lock is committed so
# the resolved versions are pinned. The recipe's build task is therefore the
# ONLINE build task, not build-offline.
#
# The binaries are then copied to /usr/local/bin so they are on PATH under the
# manual `exec "$@"` runscript, and the source trees' target/ is removed so the
# ~3.7 GB of build state never ships in the image.
post-command = [
    "apt-get update && apt-get install -y --no-install-recommends gcc g++ libc6-dev cmake make && rm -rf /var/lib/apt/lists/*",
    "cd /opt/conf && pixi run --as-is build",
    "cd /opt/conf && for t in fastcheck fastdedup fastprep fastsim fastmaps fasthelper; do cp tools/$t/target/release/$t /usr/local/bin/$t; done",
    "rm -rf /opt/conf/tools/*/target",
]

label = [
    "Authors:RaphaelRibes",
    "Description:FastSuite — Rust QC and preprocessing tools sharing one CLI, one report schema and one runner",
    "License:MIT",
    "Pixitainer_Manual:true",
]

# Docker: run unprivileged; the six binaries are on PATH, so the image is driven
# by name (`docker run fastsuite fastcheck --version`). NOTE: pixitainer has no
# entrypoint key — its manual-mode Dockerfile hardcodes
# ENTRYPOINT ["/bin/bash","-c","exec \"$@\"","--"], so an entrypoint value here
# would be silently ignored (unknown TOML keys are dropped without a warning).
# Changing the entrypoint means editing the generated Dockerfile, which
# keep-def = true leaves behind.
[tool.pixitainer.docker]
output = "fastsuite"
user = "nobody"
workdir = "/work"

[tasks]
# Build every tool in dependency order (fasthelper last).
build = "bash scripts/build.sh"
build-offline = "bash scripts/build.sh --offline"
# All six tool test suites plus the pathology corpus. The per-tool counts are
# asserted against scripts/expected-test-counts.txt by `pixi run ci`; do not
# restate them here — that is how this comment went stale (it claimed 465/466
# while the suite was at 476).
test = "bash scripts/test.sh"
# CI gate: the same suite, then an assertion that every tool's parsed test count
# matches scripts/expected-test-counts.txt — a SHORT count means cargo considered
# a stale test binary fresh and part of the suite silently never ran. It also
# refuses to run on a rustc/cargo outside the pinned range, so `pixi run ci` (the
# compiler is the env's 1.99) never gets confused with a bare `bash scripts/ci.sh`
# on a machine whose ambient cargo is 1.95.
ci = "bash scripts/ci.sh"
doctor = "./tools/fasthelper/target/release/fasthelper doctor --tools-dir tools"
demo = "bash examples/demo.sh"
report = "./tools/fasthelper/target/release/fasthelper report examples/runs/demo -o examples/runs/demo --format html,tsv"
schema = "./tools/fasthelper/target/release/fasthelper schema"
