{% set name = "fastdedup" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/RaphaelRibes/FastSuite/archive/refs/tags/fastdedup-v1.3.0.tar.gz
  sha256: FILL_ME

build:
  number: 0
  script:
    - cargo install --locked --path tools/fastdedup --root $PREFIX
  # Source is the tagged archive; every Cargo.lock is committed so
  # --locked pins the dependency graph.

requirements:
  build:
    - {{ compiler('c') }}
    - rust >=1.85
    - cmake  # libz-ng-sys (flate2's zlib-ng feature) builds the vendored zlib-ng
  run:
    - zlib

test:
  commands:
    - fastdedup --version | grep -q "fastdedup 1.3.0"
    - >
      mkdir -p fdedup_t && printf '@r1\nACGTACGT\n+\nIIIIIIII\n@r2\nACGTACGA\n+\nIIIIIIII\n' > fdedup_t/s.fastq &&
      fastdedup -1 fdedup_t/s.fastq -o fdedup_t/d.fastq && test -s fdedup_t/d.fastq

about:
  home: https://github.com/RaphaelRibes/FastSuite
  dev_url: https://github.com/RaphaelRibes/FastSuite
  doc_url: https://github.com/RaphaelRibes/FastSuite/tree/main/docs
  license: MIT
  license_family: MIT
  license_file: tools/fastdedup/LICENSE
  summary: "A fast and memory-efficient FASTX PCR deduplication tool"

extra:
  recipe-maintainers:
    - RaphaelRibes
