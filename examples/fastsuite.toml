# FastSuite run config — one file, the whole preprocessing chain.
#
#   fasthelper run -c examples/fastsuite.toml --tools-dir tools
#
# Sample paths are resolved relative to THIS file; `outdir` is relative to
# your working directory.

[run]
name = "demo"
outdir = "examples/runs/demo"
threads = 4
gz_level = 6
# Order matters. fastdedup -> fastprep -> fastmaps is the canonical chain;
# drop any step you do not need.
steps = ["fastdedup", "fastprep", "fastmaps"]
# Keep the intermediate FASTQ (deduped but untrimmed). Off by default: the
# pipeline deletes each intermediate once its last consumer has read it.
keep_intermediate = false

# Synthetic control: fastsim writes a known-truth sample, fasthelper pushes it
# through the same chain, so every run report carries a sample with a truth TSV.
#
# The profile here is the *synthetic* test profile, because this repo never
# ships data: a real profile is measured from a dataset and therefore lives
# outside the repo (see DECISIONS.md D-11). To use one, pass its path:
#   fastsim --profile /path/to/local/mandril_E.json ...
[simulate]
enabled = true
name = "sim_E"
pairs = 20000
profile = "../tools/fastsim/profiles/test_small.json"
seed = 42

# Real samples: add one [[samples]] block per sample.
# [[samples]]
# name = "E94"
# r1 = "../data/E94_R1.fastq.gz"
# r2 = "../data/E94_R2.fastq.gz"

# Per-step escape hatches: anything the shared flags do not cover goes here,
# verbatim, so a tool-specific option never blocks the common path.
#
# --adapter-preset is deliberate here: fastprep's adapter AUTO-DETECTION needs
# enough adapter-containing reads in the first ~2k reads, and a small synthetic
# set does not always provide them (it then exits 1 rather than guess). On real
# NovaSeq/Nextera data the auto-detection works and the flag can be dropped.
[steps.fastprep]
args = ["--adapter-preset", "nextera", "--r2-scan-reverse", "--min-len", "0.6L", "--min-run", "6"]

[steps.fastdedup]
args = ["--pre-count"]

# fastcheck is the terminal QC step: it reads the chain's current FASTQs and
# writes fastsuite.report.v1 + a fastsim profile, never a new FASTQ. It has no
# output to feed a later step, so list it last. Extra flags go here too.
# [steps.fastcheck]
# args = ["--insert-hist", "--max-read-len", "300"]
