# FastSuite optimisation bench — paths are absolute, nothing is inferred.
#
# `bins.baseline` must hold the six binaries built from the pre-change commit
# (frozen copies, see docs/optim/BENCH.md); `bins.new` the tree under test.

repo: /home/raphael/FastSuite
results: /mnt/Fast/fastsuite-optim/results
reads: /mnt/Fast/fastsuite-optim/reads
profile: /home/raphael/FastSuite/tools/fastsim/profiles/mandrill_E358.json

bins:
  baseline: /mnt/Fast/fastsuite-optim/baseline-bin
  new: /mnt/Fast/fastsuite-optim/new-bin

# The measured tools. fasthelper is handled by its own rules (it aggregates a
# synthesised report tree, not reads), and fastsim carries the gzip-level axis.
tools: [fastcheck, fastdedup, fastmaps, fastprep, fastsim]

sizes: [100000, 1000000, 5000000]
threads: [1, 2, 4]

# fastsim is single-threaded, so it only carries the level axis.
fastsim_gz_levels: [0, 1, 6]

helper_samples: [2000, 5000]

# Installed comparators (path -> binary). fastp is the one head-to-head this
# round changes; FastQC/Falco/cutadapt/MultiQC are not installed on the desktop,
# so their numbers stay as committed and the papers say so.
comparators:
  fastp: /home/raphael/.local/bin/fastp
