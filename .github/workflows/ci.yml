name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      # The suite runs `cargo test --offline` (a test run must not hit the
      # network mid-suite), so the registry has to be primed FIRST. On a fresh
      # runner ~/.cargo is empty and the very first command fails at resolution
      # — "error: no matching package named `clap` found" — which is why this
      # step exists ahead of the tests rather than inside them.
      - name: Fetch crates
        run: |
          set -e
          for t in fastdedup fastprep fastcheck fastmaps fastsim fasthelper; do
            (cd tools/$t && pixi run cargo fetch)
          done
      # The test-count manifest is a staleness detector: a short count means a
      # stale test binary, so ci.sh fails rather than lowering the number.
      - run: pixi run ci
      # Lint gate: every crate must at least compile under clippy. An erasing_op
      # class of error once shipped in fastmaps because nothing ran the linter.
      # The remaining warnings are tracked in docs/STATUS.md and are not denied
      # yet, because no crate is currently warning-clean under --all-targets.
      - name: clippy
        run: |
          set -e
          for t in fastdedup fastprep fastcheck fastmaps fastsim fasthelper; do
            (cd tools/$t && cargo clippy --release --offline --all-targets)
          done
