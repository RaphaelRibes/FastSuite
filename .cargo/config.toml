# FastSuite cargo configuration (repo-level, applies to every tool checkout).
#
# The conda toolchain pixi's env provides (sysroot_linux-64 2.28) ships a
# Scrt1.o that references __libc_csu_init/__libc_csu_fini — symbols glibc
# removed in 2.34 — and its cc driver links against that sysroot. On a
# machine whose system glibc also lacks the symbols (Debian ≥ 2.34), linking
# a Rust binary inside the pixi env fails with:
#
#   rust-lld: error: undefined symbol: __libc_csu_init
#       >>> referenced by .../sysroot/usr/lib/../lib64/Scrt1.o:(_start)
#
# The fix: link the FINAL Rust binary with the SYSTEM compiler (/usr/bin/cc)
# and the system glibc. Cargo's build scripts (the cc crate, cmake for
# zlib-ng/libdeflate/zstd) still use the conda toolchain via $CC — they work
# fine; only the final link was broken.
#
# The only system dependency this creates is gcc (build-essential on Debian,
# gcc on CachyOS). If /usr/bin/cc is missing, install it.

[target.x86_64-unknown-linux-gnu]
linker = "/usr/bin/cc"
rustflags = ["-C", "link-arg=-fuse-ld=bfd"]
