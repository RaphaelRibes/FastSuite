# FastSuite cargo configuration (repo-level, applies to every tool checkout).
#
# The conda sysroot pixi provides (sysroot_linux-64 2.28) ships a Scrt1.o that
# references __libc_csu_init/__libc_csu_fini, symbols removed from glibc in
# 2.34 and absent from that sysroot's libc.so — so linking a Rust binary with
# the conda cc fails with "undefined symbol: __libc_csu_init". The system
# toolchain (/usr/bin/cc, the distro's glibc) has them, so we link with it.
#
# Verified: fastdedup links and runs with this on a fresh desktop install
# (fastdedup 1.3.0, --version OK).
#
# If you build outside pixi with a system rustc, this is a no-op.

[target.x86_64-unknown-linux-gnu]
linker = "/usr/bin/cc"
rustflags = ["-C", "link-arg=-fuse-ld=bfd"]
