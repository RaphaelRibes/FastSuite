[workspace]
channels = ["conda-forge"]
name = "fastmaps"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
start = "marimo run heatmap_explorer.py"

[dependencies]
rust = ">=1.94.0,<1.95"
c-compiler = ">=1.11.0,<2"
cmake = ">=4.3.1,<5"
cxx-compiler = ">=1.11.0,<2"
make = ">=4.4.1,<5"
gcc = ">=14.3.0,<14.4"
python = ">=3.14.4,<3.15"
marimo = ">=0.23.3,<0.24"

[pypi-dependencies]
numpy = ">=2.4.4, <3"
altair = ">=6.1.0, <7"
pandas = ">=3.0.2, <4"
pyarrow = ">=24.0.0, <25"
