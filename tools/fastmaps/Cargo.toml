[package]
name = "fastmaps"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "fastmaps"
path = "src/main.rs"

[dependencies]
png    = "0.18.1"
flate2 = "1.0"
clap   = { version = "4", features = ["derive"] }
# The suite's hashing crate (fastcheck pins the same version). fastmaps' map
# keys are (u16, u16) pairs derived from read content — never untrusted network
# input — so SipHash's DoS resistance buys nothing here (Task 2.13).
rustc-hash = "2"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
# The other five tools in the suite all carry these; fastmaps was the only
# one left without them (Task 2.14). No CPU target is set, so the shipped
# binary stays portable.
lto = "fat"
codegen-units = 1
