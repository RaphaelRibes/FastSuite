[package]
name = "fastmaps"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fastmaps"
path = "src/main.rs"

[dependencies]
png    = "0.18.1"
flate2 = "1.0"
clap   = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
# The other five tools in the suite all carry these; fastmaps was the only
# one left without them (Task 2.14). No CPU target is set, so the shipped
# binary stays portable.
lto = "fat"
codegen-units = 1
