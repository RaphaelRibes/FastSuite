[package]
name = "fastsim"
version = "0.2.0"
edition = "2021"
description = "FastSim: NovaSeq-like paired-end read simulator with full ground truth"

[dependencies]
anyhow = "1"
flate2 = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5.60", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
