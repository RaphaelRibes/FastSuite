[package]
name = "fasthelper"
version = "0.1.0"
edition = "2021"
description = "FastSuite orchestrator and report aggregator: one config in, one multi-sample report out"
authors = ["Raphaël Ribes <raphael.ribes@gmail.com>"]
license = "MIT"

[lib]
name = "fasthelper"
path = "src/lib.rs"

[[bin]]
name = "fasthelper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
