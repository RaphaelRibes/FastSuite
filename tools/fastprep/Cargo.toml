[package]
name = "fastprep"
version = "0.3.0"
edition = "2021"
description = "Asymmetric quality-weighted polyX trimming for FASTQ/FASTA reads"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
flate2 = { version = "1", features = ["zlib-ng"], default-features = false }
gzp = "2"
libc = "0.2"
memchr = "2"
mimalloc = { version = "0.1", default-features = false }
needletail = "0.7.3"
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
# No CPU target is set anywhere: the shipped binary must stay portable, and
# the repo-level .cargo/config.toml sets the linker/rustflags for every tool.

[profile.profiling]
inherits = "release"
debug = "line-tables-only"

[[bin]]
name = "fastprep"
path = "src/main.rs"

[[bin]]
name = "fastprep-meta"
path = "src/bin/pxmt.rs"
