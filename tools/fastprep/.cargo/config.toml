# Compile for the build machine's CPU. The bench dispatch node builds on the
# cluster (cpu-dedicated partition, same hardware as the benchmark jobs), and
# local builds target this laptop. Without this the binary is baseline x86-64
# (SSE2 only) and the byte-compare hot loops cannot vectorise; measured ~12%
# slower in the adapter scan (Aug 2026).
#
# NOTE: applies to every cargo invocation in this repo (dev, release, tests),
# which is what we want — the hot loops are shared.
[build]
rustflags = ["-C", "target-cpu=native"]
